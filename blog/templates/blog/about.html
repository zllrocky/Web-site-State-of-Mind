{% extends 'blog/base.html' %}

{% block content %}
<section style="padding: 180px 40px 100px 40px; max-width: 1100px; margin: 0 auto; display: flex; gap: 80px; align-items: flex-start;">
    {% if author.photo %}
    <div style="flex: 1;">
        <img src="{{ author.photo.url }}" style="width: 100%; border: 1px solid #333; filter: grayscale(50%);">
    </div>
    {% endif %}

    <div style="flex: 1.5;">
        <span style="color: #A04000; letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem;">The Mind Behind the Brand</span>
        <h1 style="font-family: 'Cormorant Garamond'; font-size: 4.5rem; margin: 20px 0 40px 0;">{{ author.name }}</h1>
        <div style="line-height: 2; color: #BDC3C7; font-size: 1.15rem; font-weight: 300;">
            {{ author.bio|linebreaks }}
        </div>
    </div>
</section>
{% endblock %}
