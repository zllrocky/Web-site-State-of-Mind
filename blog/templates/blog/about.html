{% extends 'blog/base.html' %}

{% block extra_css %}
<style>
    /* ДЕСКТОП (Оставляем как есть, раз там всё круто) */
    .about-section {
        padding: 180px 40px 100px 40px;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        gap: 80px;
        align-items: center; /* Центрируем по вертикали для баланса */
    }

    .about-image-wrapper {
        flex: 1;
    }

    .about-image {
        width: 100%;
        height: auto;
        border: 1px solid #333;
        filter: grayscale(50%);
        display: block;
    }

    .about-content {
        flex: 1.5;
    }

    .about-subtitle {
        color: #A04000;
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 0.8rem;
        display: block;
        margin-bottom: 20px;
    }

    .about-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(3rem, 6vw, 4.5rem);
        margin: 0 0 30px 0;
        line-height: 1.1;
        color: white;
    }

    .about-bio {
        line-height: 2;
        color: #BDC3C7;
        font-size: 1.15rem;
        font-weight: 300;
        text-align: left;
    }

    /* МОБИЛКА - ДЕЛАЕМ ПУШКУ */
    @media (max-width: 992px) {
        .about-section {
            flex-direction: column;
            gap: 50px; /* Даем больше воздуха между фото и текстом */
            padding: 120px 20px 80px 20px;
        }
        .about-image-wrapper {
            width: 100%;
            display: flex;
            justify-content: center; /* Центрируем фото */
        }
        .about-image {
            max-width: 85%; /* Сужаем фото, чтобы появились поля */
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); /* Добавляем глубину */
            border: 1px solid #222;
        }
        .about-content {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем весь блок контента */
        }
        .about-subtitle {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-align: center;
        }
        .about-title {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .about-bio {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #95A5A6;
            text-align: center; /* Принудительно центрируем текст био */
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="about-section">
    {% if author.photo %}
    <div class="about-image-wrapper">
        <img src="{{ author.photo.url }}" alt="{{ author.name }}" class="about-image" fetchpriority="high">
    </div>
    {% endif %}

    <div class="about-content">
        <span class="about-subtitle">The Mind Behind the Brand</span>
        <h1 class="about-title">{{ author.name }}</h1>
        <div class="about-bio">
            {{ author.bio|linebreaks }}
        </div>
    </div>
</section>
{% endblock %}
