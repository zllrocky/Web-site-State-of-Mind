{% extends 'blog/base.html' %}

{% block extra_css %}
<style>
    /* 1. ДЕСКТОП */
    .about-section {
        padding: 180px 40px 100px 40px;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 80px;
        align-items: center;
    }

    .about-image-wrapper {
        flex: 1;
    }

    .about-image {
        width: 100%;
        height: auto; /* ВОЗВРАЩАЕМ АВТО ВЫСОТУ, ЧТОБЫ НЕ МЫЛИЛО */
        border: 1px solid #333;
        filter: grayscale(20%);
        display: block;
        border-radius: 4px; /* Легкое скругление для стиля */
    }

    .about-content {
        flex: 1.5;
    }

    /* ИСПРАВЛЕНО: Жесткая центровка оранжевого текста */
    .about-subtitle {
        color: #A04000;
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 0.8rem;
        display: block;
        margin: 0 auto 20px auto;
        text-align: center;
        width: 100%;
    }

    .about-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(3rem, 6vw, 4.5rem);
        margin: 0 0 30px 0;
        line-height: 1.1;
        color: white;
    }

    .about-bio {
        line-height: 2;
        color: #BDC3C7;
        font-size: 1.15rem;
        font-weight: 300;
        text-align: left;
    }

    /* 2. ПЛАНШЕТЫ (iPad) */
    @media (min-width: 769px) and (max-width: 1100px) {
        .about-section {
            flex-direction: column;
            gap: 40px;
            padding: 140px 40px 80px 40px;
            text-align: center;
        }

        .about-image-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .about-content {
            width: 100%;
        }

        .about-bio {
            text-align: center;
            padding: 0 20px;
        }
    }

    /* 3. МОБИЛКА */
    @media (max-width: 768px) {
        .about-section {
            flex-direction: column;
            gap: 40px;
            padding: 110px 20px 60px 20px;
        }
        .about-image-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .about-image {
            max-width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .about-content {
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .about-title {
            font-size: 2.8rem;
            text-align: center;
        }
        .about-bio {
            font-size: 1.05rem;
            line-height: 1.8;
            text-align: center;
        }
    }

    /* 4. ИСПРАВЛЕНО: Широкий экран на телефоне (чтобы фото не было гигантским) */
    @media (orientation: landscape) and (max-height: 600px) {
        .about-image-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .about-image {
            max-height: 65vh !important;
            width: auto !important;
            object-fit: contain !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="about-section">
    {% if author.photo %}
    <div class="about-image-wrapper">
        <img src="{{ author.photo.url }}"
             alt="{{ author.name }}"
             class="about-image"
             width="{{ author.photo.width }}"
             height="{{ author.photo.height }}"
             fetchpriority="high">
    </div>
    {% endif %}

    <div class="about-content">
        <span class="about-subtitle">The Mind Behind the Brand</span>
        <h1 class="about-title">{{ author.name }}</h1>
        <div class="about-bio">
            {{ author.bio|linebreaks }}
        </div>
    </div>
</section>
{% endblock %}
