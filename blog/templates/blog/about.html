{% extends 'blog/base.html' %}

{% block extra_css %}
<style>
    .about-section {
        padding: 180px 40px 100px 40px;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        gap: 80px;
        align-items: flex-start;
    }

    .about-image-wrapper {
        flex: 1;
    }

    .about-image {
        width: 100%;
        height: auto;
        border: 1px solid #333;
        filter: grayscale(50%); /* Статичный фильтр без эффектов наведения */
        display: block;
    }

    .about-content {
        flex: 1.5;
    }

    .about-subtitle {
        color: #A04000;
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 0.8rem;
        display: block;
        margin-bottom: 20px;
    }

    .about-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(3rem, 6vw, 4.5rem);
        margin: 0 0 40px 0;
        line-height: 1.1;
        color: white;
    }

    .about-bio {
        line-height: 2;
        color: #BDC3C7;
        font-size: 1.15rem;
        font-weight: 300;
    }

    /* АДАПТИВНОСТЬ ДЛЯ ПЛАНШЕТОВ И ТЕЛЕФОНОВ */
    @media (max-width: 992px) {
        .about-section {
            flex-direction: column;
            gap: 40px;
            padding: 120px 40px 80px 40px;
        }
        .about-image {
            max-width: 500px;
            margin: 0 auto;
        }
    }

    @media (max-width: 768px) {
        .about-section {
            padding: 100px 20px 60px 20px;
        }
        .about-title {
            margin: 0 0 30px 0;
            font-size: 2.5rem;
        }
        .about-bio {
            font-size: 1.05rem;
            line-height: 1.8;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="about-section">
    {% if author.photo %}
    <div class="about-image-wrapper">
        <img src="{{ author.photo.url }}" alt="{{ author.name }}" class="about-image" fetchpriority="high">
    </div>
    {% endif %}

    <div class="about-content">
        <span class="about-subtitle">The Mind Behind the Brand</span>
        <h1 class="about-title">{{ author.name }}</h1>
        <div class="about-bio">
            {{ author.bio|linebreaks }}
        </div>
    </div>
</section>
{% endblock %}
